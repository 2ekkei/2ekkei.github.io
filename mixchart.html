<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mixlody谱面工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .button-group {
            display: flex;
            gap: 24px;
            background: #ffffff;
            padding: 40px 48px;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            background: #ffffff;
            color: #333333;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            white-space: nowrap;
        }

        .btn:hover {
            background: #f9f9f9;
            border-color: #cccccc;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .btn:active {
            background: #f0f0f0;
            transform: scale(0.98);
        }

        .icon {
            display: inline-block;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .icon-pack {
            position: relative;
        }
        .icon-pack::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 3px;
            width: 14px;
            height: 12px;
            border: 2px solid #666;
            border-radius: 2px;
            background: transparent;
        }
        .icon-pack::after {
            content: '';
            position: absolute;
            top: 7px;
            left: 7px;
            width: 6px;
            height: 2px;
            background: #666;
            box-shadow: 0 3px 0 #666, 3px 0 0 #666, 3px 3px 0 #666;
            border-radius: 0;
        }

        .icon-convert {
            position: relative;
        }
        .icon-convert::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 3px;
            width: 14px;
            height: 10px;
            border: 2px solid #666;
            border-radius: 50%;
            border-right-color: transparent;
            transform: rotate(-45deg);
        }
        .icon-convert::after {
            content: '';
            position: absolute;
            top: 7px;
            right: 2px;
            width: 0;
            height: 0;
            border-left: 6px solid #666;
            border-top: 4px solid transparent;
            border-bottom: 4px solid transparent;
            transform: rotate(45deg);
        }

        @media (max-width: 500px) {
            .button-group {
                flex-direction: column;
                padding: 32px 24px;
                gap: 16px;
            }
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="button-group">
        <button class="btn" onclick="window.location.href='package.html'">
            <span class="icon icon-pack"></span>
            打包谱面
        </button>

        <button class="btn" onclick="window.location.href='ma2mix.html'">
            <span class="icon icon-convert"></span>
            转换谱面
        </button>
    </div>
</body>
</html>
